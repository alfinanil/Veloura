<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Veloura</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>

<body>

    <header class="header">
        <a href="index.html" class="brand">
            <div class="logo-placeholder">V</div>
            <span>VELOURA</span>
        </a>
    </header>

    <main class="login-section">

        <form id="login-form" class="login-card" novalidate>

            <h1>Sign In</h1>

            <div class="title-divider">
                <span></span>
                <i>✦</i>
                <span></span>
            </div>

            <p class="login-subtitle">Welcome back to Veloura.</p>

            <label for="email">Email</label>
            <div class="input-group">
                <span class="input-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="M3 7l9 6 9-6"/>
                    </svg>
                </span>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <label for="password">Password</label>
            <div class="input-group">
                <span class="input-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="11" width="14" height="9" rx="2"/>
                        <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
                    </svg>
                </span>
                <input type="password" id="password" placeholder="Enter your password">
                <button type="button" id="toggle-password" class="eye-button" aria-label="Show or hide password">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <label class="show-password">
                <input type="checkbox" id="show-password"> Show password
            </label>

            <p id="login-message" class="login-message"></p>

            <button type="submit" class="login-button">Sign In</button>

            <div class="or-divider">
                <span></span>
                <p>or</p>
                <span></span>
            </div>

            <p class="create-account">
                Don't have an account? <a href="#">Create Account</a>
            </p>

        </form>

    </main>

</body>
</html>
